<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>Beat → Song Builder • Melodic Space</title>
<style>
:root{--text:#f7f7fb;--muted:#9b9bad;--line:#2a2a37;--accent:#22d3ee;--accent2:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 8px));margin:auto}.panel{border:1px solid rgba(34,211,238,.38);background:linear-gradient(135deg,rgba(34,211,238,.10),rgba(139,92,246,.10));border-radius:18px;padding:14px 15px;margin-bottom:10px}.row{display:flex;gap:12px;align-items:flex-start}.switch{position:relative;width:48px;height:28px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:999px;background:#343442;border:1px solid #4a4a5b;transition:.2s;cursor:pointer}.slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:#67e8f9}.switch input:checked+.slider:before{transform:translateX(20px)}h2{font-size:15px;margin:1px 0 4px}.sub{font-size:12px;color:var(--muted);line-height:1.45}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chips span{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:5px 7px;background:#0d0d13;color:#d9d9e5}.status{font-size:10px;font-weight:900;color:#a5f3fc;margin-top:8px}iframe{display:block;width:100%;border:0;min-height:1700px;background:transparent}@media(max-width:520px){.panel{padding:12px}.sub{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<div class="row">
<label class="switch" aria-label="Melodic space mode"><input id="spaceMode" type="checkbox" checked><span class="slider"></span></label>
<div><h2>Melodic Space mode</h2><div class="sub">When on, the song is written around breathing room, held phrases, repetition, and silence instead of filling every bar with words.</div><div class="chips"><span>fewer lyric attacks</span><span>multi-bar phrases</span><span>rests count as writing</span><span>held notes</span><span>repeat fragments</span><span>no bar-filling</span></div><div class="status" id="spaceStatus">MELODIC SPACE MODE ON</div></div>
</div>
</section>
<iframe id="qualityFrame" src="beat-quality-fit.html" title="Beat builder quality and voice controls"></iframe>
</div>
<script>
const frame=document.getElementById('qualityFrame'),space=document.getElementById('spaceMode'),status=document.getElementById('spaceStatus');
const spaceRules=`MELODIC-SPACE MODE: ON.
Write the vocal as a melody living INSIDE the instrumental, not as bars placed on top of every open slot.
- Silence, held vowels, breaths, instrumental answers, and repeated fragments count as part of the composition. Do not treat empty bars as problems to fill.
- Before writing lyrics, identify where the beat itself needs to breathe. Mark those moments as intentional NO VOCAL or HOLD instead of adding more words.
- Default to FEWER lyric attacks. A 4-bar phrase does not need 4 separate lyric lines. One or two strong melodic phrases may carry several bars.
- Prefer a natural melodic sentence stretched across multiple bars over one sentence per bar.
- Hooks should usually revolve around 1–3 memorable phrases, with repetition, held endings, and gaps between them. Do not write an 8-line hook just because the section is 8 bars.
- Verses may be denser than hooks, but still leave meaningful gaps. Avoid continuous wall-to-wall vocals unless the beat clearly demands it.
- When a phrase lands well, let the instrumental answer it before the next lyric enters.
- Do not force new wording on every downbeat. Repeating a word, fragment, vowel, or short phrase is better than adding filler.
- Use long notes only where they feel emotionally natural and easy for the vocalist; otherwise use a short phrase followed by silence.
- For every section, explicitly state a VOCAL DENSITY target: Sparse, Medium, or Dense. Default hooks and emotional sections to Sparse or Medium unless the beat strongly argues otherwise.
- For every section, show at least one intentional REST/HOLD location if musically appropriate.
- Run a final OVERFILL CHECK: if removing 20–40% of the words makes the song feel more melodic or natural, remove them before presenting the final answer.
- The goal is not to maximize lyrics. The goal is to make the vocal feel inevitable, singable, memorable, and naturally fused with the beat.`;
let patchedFn=null;
function innerBuilder(){try{const q=frame.contentDocument;if(!q)return null;const b=q.getElementById('builder');return b&&b.contentWindow?b.contentWindow:null}catch(e){return null}}
function patch(){try{const w=innerBuilder();if(!w||typeof w.buildRequest!=='function')return;if(w.buildRequest!==patchedFn){const current=w.buildRequest.bind(w);const wrapped=function(){const base=current();return space.checked?base+'\n\n'+spaceRules:base};patchedFn=wrapped;w.buildRequest=wrapped;const oldFlow=typeof w.flowFor==='function'?w.flowFor.bind(w):null;if(oldFlow&&!w.__melodicSpaceFlowPatched){w.flowFor=function(structure){const out=oldFlow(structure);return out.map(x=>({...x,text:x.text+(space.checked?' Melodic-space: use fewer lyric entries, longer phrases, held endings, and intentional rests; do not fill every bar.':'')}))};w.__melodicSpaceFlowPatched=true}}if(w.beatReport&&typeof w.render==='function'){try{w.render()}catch(e){}}resize()}catch(e){}}
function resize(){try{const d=frame.contentDocument,h=Math.max(d.documentElement.scrollHeight,d.body?.scrollHeight||0);if(h>500)frame.style.height=(h+40)+'px'}catch(e){}}
function sync(){status.textContent=space.checked?'MELODIC SPACE MODE ON':'MELODIC SPACE MODE OFF';status.style.color=space.checked?'#a5f3fc':'#b8b8c8';patch()}
space.addEventListener('change',sync);frame.addEventListener('load',()=>{patchedFn=null;setTimeout(patch,200);setTimeout(patch,700);setTimeout(patch,1400)});setInterval(()=>{patch();resize()},1200);sync();
</script>
</body>
</html>
