<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>Music Coach</title>
<style>
:root{--bg:#09090d;--panel:#111118;--text:#f7f7fb;--muted:#9b9bad;--line:#2a2a37;--accent:#8b5cf6;--accent2:#22d3ee;--good:#34d399}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,rgba(139,92,246,.18),transparent 38%),radial-gradient(circle at 90% 0,rgba(34,211,238,.12),transparent 32%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(1120px,calc(100% - 18px));margin:auto;padding:14px 0 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2))}.free{font-size:12px;font-weight:800;color:#bff5d9;border:1px solid rgba(52,211,153,.25);padding:7px 10px;border-radius:999px;background:rgba(52,211,153,.08)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.tab{border:1px solid var(--line);background:#12121a;color:#bdbdcb;padding:11px 8px;border-radius:13px;font-weight:900;font-size:13px;cursor:pointer}.tab.active{background:linear-gradient(135deg,rgba(139,92,246,.24),rgba(34,211,238,.12));border-color:#554a8c;color:#fff}.frame{display:none;width:100%;border:0;background:transparent;min-height:1500px}.frame.active{display:block}.note{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 0}@media(max-width:520px){.free{display:none}.tab{font-size:11px;padding:10px 5px}.shell{width:min(100% - 10px,1120px)}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand"><div class="logo">♫</div><div>Music Coach</div></div><div class="free">$0 • local tools • no API</div></header>
<nav class="tabs" aria-label="Music Coach workflow">
<button class="tab active" data-mode="beat">1️⃣ 🥁 Beat → Song Builder</button>
<button class="tab" data-mode="lyrics">2️⃣ ✍️ Lyrics & Delivery</button>
<button class="tab" data-mode="scan">3️⃣ 🎵 Song Scan</button>
</nav>
<iframe id="beatFrame" class="frame active" src="beat-native-generator.html?v=dna-v3-20260821-1" title="Beat to Song Builder with DNA Native Generator v3"></iframe>
<iframe id="toolsFrame" class="frame" src="song-tools.html" title="Lyrics Lab and Song Scan"></iframe>
<div class="note">Workflow: build from the beat → refine lyrics/delivery → scan the finished song. Native song generation uses browser code only: no model download, API, credits, trial, or account.</div>
</main>
<script>
const tabs=[...document.querySelectorAll('.tab')],tools=document.getElementById('toolsFrame'),beat=document.getElementById('beatFrame');let mode='beat';
function cleanTools(){try{const d=tools.contentDocument;if(!d)return;if(!d.getElementById('shellEmbedStyle')){const s=d.createElement('style');s.id='shellEmbedStyle';s.textContent='.top,.tabs,.footer{display:none!important}.shell{padding-top:0!important;width:min(1080px,calc(100% - 8px))!important}';d.head.appendChild(s)}const wanted=mode==='lyrics'?'lyricsView':'scanView',btn=d.querySelector('.tab[data-view="'+wanted+'"]');if(btn&&!btn.classList.contains('active'))btn.click();const h=Math.max(d.documentElement.scrollHeight,d.body?.scrollHeight||0);if(h>400)tools.style.height=(h+28)+'px'}catch(e){}}
function resizeBeat(){try{const d=beat.contentDocument,h=Math.max(d.documentElement.scrollHeight,d.body?.scrollHeight||0);if(h>400)beat.style.height=(h+28)+'px'}catch(e){}}
function select(next){mode=next;tabs.forEach(x=>x.classList.toggle('active',x.dataset.mode===next));const isBeat=next==='beat';tools.classList.toggle('active',!isBeat);beat.classList.toggle('active',isBeat);if(isBeat)resizeBeat();else cleanTools();window.scrollTo({top:0,behavior:'smooth'})}
tabs.forEach(b=>b.addEventListener('click',()=>select(b.dataset.mode)));tools.addEventListener('load',()=>{if(mode!=='beat'){cleanTools();setTimeout(cleanTools,250);setTimeout(cleanTools,900)}});beat.addEventListener('load',()=>{resizeBeat();setTimeout(resizeBeat,300);setTimeout(resizeBeat,1000)});setInterval(()=>{mode==='beat'?resizeBeat():cleanTools()},1600);
</script>
</body>
</html>
